<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7 Voltas — Merry Go Round</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Tela inicial para liberar o áudio no navegador -->
  <div id="start-screen" class="overlay">
    <div class="intro-box">
      <h1>Merry Go Round</h1>
      <p>7 voltas no mesmo lugar. 7 emoções diferentes.</p>
      <button id="start-btn">Iniciar o Carrossel</button>
    </div>
  </div>

  <!-- Interface Principal -->
  <main class="container">
    <header class="hud-top">
      <span id="lap-counter">Volta 1 de 7</span>
      <h2 id="emotion-title">O Começo do Dia</h2>
    </header>

    <!-- Palco do Carrossel 3D -->
    <div class="scene">
      <div class="carousel" id="carousel">

        <!-- Painel 01 -->
        <div class="panel" style="--i:0;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

        <!-- Painel 02 -->
        <div class="panel" style="--i:1;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

        <!-- Painel 03 -->
        <div class="panel" style="--i:2;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

        <!-- Painel 04 -->
        <div class="panel" style="--i:3;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

        <!-- Painel 05 -->
        <div class="panel" style="--i:4;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

        <!-- Painel 06 -->
        <div class="panel" style="--i:5;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

        <!-- Painel 07 -->
        <div class="panel" style="--i:6;">
          <div class="horse-top">
            <div class="pole"></div>
            <img src="1795733809557.jpg" class="horse-img" alt="Cavalo de carrossel" />
          </div>
          <img class="panel-photo" src="1795800624462.jpg" loop muted playsinline preload="auto"></foto>
        </div>

      </div>
    </div>

    <footer class="hud-bottom">
      <p id="reflection-text">"Às vezes parece que estamos girando sem sair do lugar..."</p>
      <p id="music-name" class="music-tag">🎵 Tocando: Faixa 01</p>
    </footer>
  </main>

  <audio id="audio-player"></audio>
  <script src="script.js"></script>
</body>
            </html>
