<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7 Voltas — Merry Go Round</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Tela inicial para liberar o áudio no navegador -->
  <div id="start-screen" class="overlay">
    <div class="intro-box">
      <h1>Merry Go Round</h1>
      <p>7 voltas no mesmo lugar. 7 emoções diferentes.</p>
      <button id="start-btn">Iniciar o Carrossel</button>
    </div>
  </div>

  <!-- Interface Principal -->
  <main class="container">
    <header class="hud-top">
      <span id="lap-counter">Volta 1 de 7</span>
      <h2 id="emotion-title">O Começo do Dia</h2>
    </header>

    <!-- Palco do Carrossel 3D -->
    <div class="scene">
      <div class="carousel" id="carousel">

        <!-- Painel 01 -->
        <div class="panel" style="--i:0;">
          <div class="horse-top">
            <div class="pole"></div>
            <svg class="horse-svg" viewBox="0 0 64 64" fill="currentColor">
              <path d="M47 12c-2-2-5-2-7 0l-4 4-8-2c-3-1-6 1-7 4l-3 9-8 4c-2 1-3 3-2 5l2 4c1 2 3 2 5 1l5-3 2 14h5l1-10 8 2 3 8h5l-2-12 5-6c3-3 4-8 2-12l2-4c1-2 0-5-2-6zM43 17a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
            </svg>
          </div>
          <video class="panel-video" src="videos/ondas.mp4" autoplay loop muted playsinline></video>
          <div class="panel-content">
            <span>01</span>
            <p>Calma</p>
          </div>
        </div>

        <!-- Painel 02 -->
        <div class="panel" style="--i:1;">
          <div class="horse-top">
            <div class="pole"></div>

          </div>

          <div class="panel-content">
            <span>02</span>
            <p>Pressa</p>
          </div>
        </div>

        <!-- Painel 03 -->
        <div class="panel" style="--i:2;">
          <div class="horse-top">
            <div class="pole"></div>

            </svg>
          </div>
          <video class="panel-video" src="videos/ondas.mp4" autoplay loop muted playsinline></video>

              <path d="M47 12c-2-2-5-2-7 0l-4 4-8-2c-3-1-6 1-7 4l-3 9-8 4c-2 1-3 3-2 5l2 4c1 2 3 2 5 1l5-3 2 14h5l1-10 8 2 3 8h5l-2-12 5-6c3-3 4-8 2-12l2-4c1-2 0-5-2-6zM43 17a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>

    <footer class="hud-bottom">
      <p id="reflection-text">"Às vezes parece que estamos girando sem sair do lugar..."</p>
      <p id="music-name" class="music-tag">🎵 Tocando: Faixa 01</p>

  </main>

  <audio id="audio-player"></audio>
  <script src="script.js"></script>
